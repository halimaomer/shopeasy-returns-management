spring.application.name=returns-management

# Verbindung zu RabbitMQ (siehe docker-compose.yml)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=shopeasy
spring.rabbitmq.password=shopeasy

# Fehlgeschlagene Nachrichten nicht endlos neu zustellen,
# sondern an die Dead-Letter-Exchange weitergeben
spring.rabbitmq.listener.simple.default-requeue-rejected=false
